<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">Wi-Fi heart-rate logger data flow</title>
  <desc id="d">A Raspberry Pi Pico W posts each reading to Airtable every five seconds, sends every third batch of readings to a Hugging Face language model for a short assessment, and emails the result through Gmail SMTP.</desc>
  <style>
    .box{fill:#ffffff;stroke:#cfcfca;stroke-width:2}
    .hl{fill:#e8effc;stroke:#1f5bd8;stroke-width:2.5}
    .t{font:600 32px 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;fill:#16181d}
    .s{font:400 21px 'IBM Plex Mono',Consolas,monospace;fill:#7a808b}
    .e{stroke:#9aa0aa;stroke-width:2.5;fill:none}
    .m{fill:#9aa0aa}
    .l{font:500 20px 'IBM Plex Mono',Consolas,monospace;fill:#4a4f59}
    .cap{font:500 20px 'IBM Plex Mono',Consolas,monospace;fill:#7a808b;letter-spacing:1px}
    @media (prefers-color-scheme:dark){
      .box{fill:#161920;stroke:#353b47}
      .hl{fill:#1a2540;stroke:#7ea6ff}
      .t{fill:#e8eaee}.s{fill:#838a96}
      .e{stroke:#5a616d}.m{fill:#5a616d}
      .l{fill:#b0b6c1}.cap{fill:#838a96}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="m"/>
    </marker>
  </defs>

  <text x="90" y="62" class="cap">DATA FLOW · V6</text>

  <!-- Pico W -->
  <rect x="90" y="270" width="340" height="210" rx="18" class="hl"/>
  <text x="125" y="335" class="t">Pico W</text>
  <text x="125" y="378" class="s">MicroPython</text>
  <text x="125" y="412" class="s">simulated BPM</text>
  <text x="125" y="446" class="s">60–100, every 5 s</text>

  <!-- Airtable -->
  <rect x="770" y="80" width="340" height="150" rx="18" class="box"/>
  <text x="805" y="145" class="t">Airtable</text>
  <text x="805" y="188" class="s">cloud log · BPM + time</text>

  <!-- Hugging Face -->
  <rect x="770" y="300" width="340" height="150" rx="18" class="box"/>
  <text x="805" y="365" class="t">Hugging Face</text>
  <text x="805" y="408" class="s">Qwen3.5-9B chat API</text>

  <!-- Gmail -->
  <rect x="770" y="520" width="340" height="150" rx="18" class="box"/>
  <text x="805" y="585" class="t">Gmail SMTP</text>
  <text x="805" y="628" class="s">report → inbox</text>

  <!-- Edges -->
  <path d="M430 312 C600 312 590 155 762 155" class="e" marker-end="url(#a)"/>
  <text x="472" y="222" class="l">REST POST</text>

  <path d="M438 375 L762 375" class="e" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="482" y="358" class="l">every 3rd reading</text>

  <path d="M430 438 C600 438 590 595 762 595" class="e" marker-end="url(#a)"/>
  <text x="440" y="572" class="l">SMTP over TLS</text>
</svg>
